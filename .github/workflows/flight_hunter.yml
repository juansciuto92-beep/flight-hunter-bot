name: Flight Hunter Bot (BUE <-> MIA)

on:
  schedule:
    # Se ejecuta 2 veces por día: 12:00 UTC (09:00 hs Argentina) y 00:00 UTC (21:00 hs Argentina)
    - cron: "0 0,12 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write

jobs:
  hunt-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar escaneo de vuelos y enviar alertas
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          MAX_PRICE_PER_LEG_USD: "450"
          MAX_PRICE_ROUNDTRIP_USD: "900"
          HEADLESS: "true"
        run: python main.py --once

      - name: Guardar historial de ofertas vistas (para no repetir correos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json last_scan_results.json || true
          git diff --staged --quiet || (git commit -m "chore: actualizar historial de ofertas [skip ci]" && git push)
